[project]
name = "ffs"
version = "0.0.1"
description = "Fireproofing takeoff, estimating, shop-drawing and field platform built on one project model"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.26",
  "shapely>=2.0",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "typer>=0.12",
  "python-ulid>=2.2",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
inventory = ["python-docx>=1.1"]

[project.scripts]
ffs = "ffs.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/ffs/cli.py" = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
